<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>塊材管理</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>
body {
  font-family: sans-serif;
  margin: 0;
  padding: 10px;
  background: #f5f5f5;
}
button {
  padding: 10px;
  margin: 5px;
}
.card {
  background: #fff;
  padding: 10px;
  margin-bottom: 10px;
  border-radius: 10px;
}
</style>
</head>

<body>

<h3>塊材管理</h3>

<input id="keyword" placeholder="輸入品名或尺寸">
<button onclick="search()">查詢</button>

<div id="result"></div>

<hr>

<h4>手動入庫</h4>
<input id="name" placeholder="品名">
<input id="size" placeholder="尺寸">
<input id="qty" placeholder="數量">
<input id="loc" placeholder="位置">
<button onclick="manualIn()">送出</button>

<script>
const API = "https://line-bot-inventory-5487.onrender.com";

let isSubmitting = false;
let profile = null;

// =========================
// 初始化 LIFF
// =========================
async function init() {
  try {
    await liff.init({ liffId: "2009630662-Qeb3Wh1t" });

    if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }

    profile = await liff.getProfile();
    console.log("登入成功", profile);
  } catch (e) {
    console.error(e);
  }
}

init();

// =========================
// 共用 API（加超時）
// =========================
async function callAPI(url, options = {}) {
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 10000);

  try {
    const res = await fetch(API + url, {
      ...options,
      headers: {
        "Content-Type": "application/json",
        "X-LIFF-ID-Token": liff.getIDToken() || "",
        ...(options.headers || {})
      },
      signal: controller.signal
    });

    const data = await res.json();

    if (!res.ok) throw new Error(data.message || "錯誤");

    return data;
  } catch (err) {
    if (err.name === "AbortError") {
      throw new Error("伺服器回應超時");
    }
    throw err;
  } finally {
    clearTimeout(timeout);
  }
}

// =========================
// 查詢
// =========================
async function search() {
  if (isSubmitting) return;

  const keyword = document.getElementById("keyword").value.trim();
  if (!keyword) return alert("請輸入關鍵字");

  isSubmitting = true;

  try {
    const data = await callAPI(`/api/search?q=${encodeURIComponent(keyword)}`);

    const list = data.items || [];
    const div = document.getElementById("result");
    div.innerHTML = "";

    if (!list.length) {
      div.innerHTML = "找不到資料";
      return;
    }

    list.forEach(item => {
      const el = document.createElement("div");
      el.className = "card";

      el.innerHTML = `
        <b>${item.品名}</b><br>
        尺寸: ${item.尺寸}<br>
        數量: ${item.數量}<br>
        位置: ${item.位置}<br>
        <input placeholder="數量" id="qty_${item.row_number}">
        <button onclick="inStock(${item.row_number})">入庫</button>
        <button onclick="outStock(${item.row_number})">出庫</button>
      `;

      div.appendChild(el);
    });

  } catch (e) {
    alert(e.message);
  } finally {
    isSubmitting = false;
  }
}

// =========================
// 入庫
// =========================
async function inStock(row) {
  if (isSubmitting) return;

  const qty = document.getElementById("qty_" + row).value;

  if (!qty || qty <= 0) return alert("數量錯誤");

  isSubmitting = true;

  try {
    await callAPI("/api/in", {
      method: "POST",
      body: JSON.stringify({
        row_number: row,
        qty: Number(qty),
        line_user_id: profile?.userId || "",
        line_name: profile?.displayName || ""
      })
    });

    alert("入庫成功");
    search();

  } catch (e) {
    alert(e.message);
  } finally {
    isSubmitting = false;
  }
}

// =========================
// 出庫
// =========================
async function outStock(row) {
  if (isSubmitting) return;

  const qty = document.getElementById("qty_" + row).value;

  if (!qty || qty <= 0) return alert("數量錯誤");

  isSubmitting = true;

  try {
    await callAPI("/api/out", {
      method: "POST",
      body: JSON.stringify({
        row_number: row,
        qty: Number(qty),
        line_user_id: profile?.userId || "",
        line_name: profile?.displayName || ""
      })
    });

    alert("出庫成功");
    search();

  } catch (e) {
    alert(e.message);
  } finally {
    isSubmitting = false;
  }
}

// =========================
// 手動入庫
// =========================
async function manualIn() {
  if (isSubmitting) return;

  const name = document.getElementById("name").value.trim();
  const size = document.getElementById("size").value.trim();
  const qty = document.getElementById("qty").value.trim();
  const loc = document.getElementById("loc").value.trim();

  if (!name || !size || !qty || !loc) {
    return alert("請填完整");
  }

  isSubmitting = true;

  try {
    await callAPI("/api/manual-in", {
      method: "POST",
      body: JSON.stringify({
        name,
        size,
        qty: Number(qty),
        location: loc,
        line_user_id: profile?.userId || "",
        line_name: profile?.displayName || ""
      })
    });

    alert("新增成功");

  } catch (e) {
    alert(e.message);
  } finally {
    isSubmitting = false;
  }
}
</script>

</body>
</html>
